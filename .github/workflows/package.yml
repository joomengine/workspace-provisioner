name: Release package verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: pdo, posix, sodium
          tools: composer:v2
          coverage: none
      - run: bash tests/package.sh
      - run: bash tools/package.sh "0.1.0-dev.${{ github.run_number }}" "$RUNNER_TEMP/release-package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-package-${{ github.sha }}
          path: ${{ runner.temp }}/release-package/
          retention-days: 14
          if-no-files-found: error
