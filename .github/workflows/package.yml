name: Release package verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo, posix, sodium
          tools: composer:v2
          coverage: none
      - run: bash tests/package.sh
      - run: bash tools/package.sh "0.1.0-dev.${{ github.run_number }}" "$RUNNER_TEMP/release-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package-${{ github.sha }}
          path: ${{ runner.temp }}/release-package/
          retention-days: 14
          if-no-files-found: error
