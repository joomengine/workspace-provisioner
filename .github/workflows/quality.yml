name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql, posix, sodium
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: php tools/check.php
      - run: php tests/run.php
      - name: Shell syntax and lint
        run: |
          find guest tools tests images -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find guest tools tests images -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workspace_test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: workspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, posix, sodium
          coverage: none
      - run: php tests/postgres.php
        env:
          WP_TEST_DSN: pgsql:host=127.0.0.1;port=5432;dbname=workspace_test
          WP_TEST_USER: workspace_test
          WP_TEST_PASSWORD: disposable-test-only
