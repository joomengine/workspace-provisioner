name: Container integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo, posix, sodium
          coverage: none
      - name: Install unprivileged OCI manifest resolver
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - name: Test on disposable hosted Docker daemon
        run: bash tests/container.sh
        env:
          WP_RUN_CONTAINER_TESTS: '1'
