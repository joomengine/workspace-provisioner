name: Container integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: pdo, posix, sodium
          coverage: none
      - name: Install unprivileged OCI manifest resolver
        run: sudo apt-get update -qq && sudo apt-get install -y skopeo
      - name: Test on disposable hosted Docker daemon
        run: bash tests/container.sh
        env:
          WP_RUN_CONTAINER_TESTS: '1'
