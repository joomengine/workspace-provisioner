name: Source package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-package"
          git rev-parse HEAD > "$RUNNER_TEMP/source-package/COMMIT"
          git archive --format=tar --prefix=workspace-provisioner/ HEAD | gzip -n > "$RUNNER_TEMP/source-package/workspace-provisioner.tar.gz"
          cd "$RUNNER_TEMP/source-package"
          sha256sum workspace-provisioner.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workspace-provisioner-source-${{ github.sha }}
          path: ${{ runner.temp }}/source-package/
          if-no-files-found: error
          retention-days: 7
